# 持续集成：每次提交、每个 PR 都自动跑一遍，让"改坏了东西"在合并之前就被发现。
#
# 四个并行的任务：
#   backend   后端测试（带真实的 PostgreSQL + pgvector）+ 不花钱的评估参照线
#   frontend  前端的 lint、类型检查、测试、生产构建
#   docker    构建镜像并起整套容器，跑冒烟测试（scripts/smoke_test_stack.py，和本机运行的是同一个脚本）
#   audit     依赖漏洞扫描（不阻塞：新漏洞公布不该让无关的提交变红，但要能看到）
#
# 这个流水线【不需要任何密钥】：测试用假的模型，冒烟测试用假的密钥，评估只跑不调用模型的参照线。
# 所以不引用 secrets，也不会有人通过 PR 偷走什么（见下面 permissions 和触发条件）。

name: CI

on:
  push:
    branches: [main]
  pull_request:          # 注意：用 pull_request，不用 pull_request_target（后者会让外部 PR 的代码带着仓库的写权限运行）
  workflow_dispatch:

# 一个分支上新的提交到来时，取消还在跑的旧流水线（省时间，也省 CI 分钟数）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：默认只能读仓库内容，不能写、不能改 PR、不能读密钥。
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # 必须和 docker-compose.yml 里的数据库是同一个镜像（有测试检查它们没有分叉）。
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: devpassword   # 仅限这个一次性的 CI 数据库
          POSTGRES_DB: agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # 数据库没起来时，依赖它的测试必须【失败】而不是被悄悄跳过（见 tests/db_guard.py）。
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # 和 Dockerfile 的基础镜像保持一致
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q -ra
      - name: Evaluation baselines (free, no model calls)
        run: |
          for baseline in oracle latest_deploy runbook_copy ticket_echo; do
            python scripts/eval_agent.py --llm "$baseline" --out "/tmp/$baseline.jsonl" | grep -E "^=== |Top-1" 
          done | tee -a "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # 和 frontend/Dockerfile 的基础镜像保持一致
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci          # 严格按锁文件安装；锁文件缺包时在 Linux 上会失败（正是我们之前遇到的问题）
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the images, start the whole stack and check it
        run: python3 scripts/smoke_test_stack.py   # 只用标准库，不需要装依赖

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true    # 不阻塞：见文件开头的说明
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pip-audit && pip-audit -r requirements-prod.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev
        working-directory: frontend
